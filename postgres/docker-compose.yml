version: '3'
services:
  postgres:
    image: 'postgres:14'
    shm_size: '2g'
    command: postgres -c max_wal_size=2GB -c checkpoint_timeout=15min
    volumes:
      - './postgres_data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_PASSWORD=lrharvester
      - POSTGRES_USER=lrharvester
      - POSTGRES_DB=lrharvester
    ports:
      - '5432:5432'

